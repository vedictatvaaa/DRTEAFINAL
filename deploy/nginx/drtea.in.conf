# /etc/nginx/sites-available/drtea.in
#
# Nginx config for the Dr Tea storefront on a Hostinger VPS.
#  - Serves the built React app from /var/www/drtea
#  - Reverse-proxies /api/*, /sitemap*.xml, /robots.txt, and merchant feeds
#    to the Node API server (PM2) on 127.0.0.1:8080
#  - Forces HTTPS, modern TLS, gzip, and long-cached static assets
#
# After editing:
#   sudo ln -sf /etc/nginx/sites-available/drtea.in /etc/nginx/sites-enabled/drtea.in
#   sudo nginx -t && sudo systemctl reload nginx

# ---- HTTP -> HTTPS redirect ----
server {
    listen 80;
    listen [::]:80;
    server_name drtea.in www.drtea.in;

    # Let's Encrypt http-01 challenge
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }

    location / { return 301 https://$host$request_uri; }
}

# ---- HTTPS (apex) ----
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name drtea.in www.drtea.in;

    # Certificates issued by certbot --nginx (see DEPLOY_HOSTINGER.md)
    ssl_certificate     /etc/letsencrypt/live/drtea.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/drtea.in/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Redirect www -> apex
    if ($host = www.drtea.in) { return 301 https://drtea.in$request_uri; }

    root  /var/www/drtea;
    index index.html;

    # Security & SEO headers
    add_header X-Frame-Options           SAMEORIGIN          always;
    add_header X-Content-Type-Options    nosniff             always;
    add_header Referrer-Policy           strict-origin-when-cross-origin always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 25m;

    # ---- gzip ----
    gzip               on;
    gzip_vary          on;
    gzip_min_length    1024;
    gzip_proxied       any;
    gzip_comp_level    6;
    gzip_types
        text/plain text/css application/json application/javascript
        text/xml application/xml application/xml+rss text/javascript
        image/svg+xml application/wasm font/ttf font/otf;

    # ---- API + server-rendered SEO endpoints ----
    location /api/ {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 60s;
    }

    # Sitemaps + robots are owned by the api-server (uses live data)
    location ~ ^/(sitemap\.xml|sitemap-images\.xml|robots\.txt)$ {
        proxy_pass         http://127.0.0.1:8080$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Merchant feeds (Google Merchant Center, Meta catalog)
    location ~ ^/feeds/ {
        proxy_pass         http://127.0.0.1:8080$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ---- Long-cached, content-hashed assets from Vite ----
    location /assets/ {
        access_log off;
        expires    1y;
        add_header Cache-Control "public, immutable";
        try_files  $uri =404;
    }

    # Public images and other static assets
    location /images/ {
        access_log off;
        expires    30d;
        add_header Cache-Control "public";
        try_files  $uri =404;
    }

    # Service worker must NOT be cached by the CDN/browser
    location = /sw.js          { add_header Cache-Control "no-cache, no-store, must-revalidate"; try_files $uri =404; }
    location = /manifest.webmanifest { try_files $uri =404; }

    # ---- SPA fallback (must be last) ----
    location / {
        try_files $uri $uri/ /index.html;
    }
}
