          type: array
          items: { type: string }
        proposed:
          oneOf:
            - { $ref: "#/components/schemas/CampaignBundle" }
            - { type: "null" }
        scheduledAt: { type: string, format: date-time, nullable: true }
    ApproveCampaignBody:
      type: object
      properties:
        activateExperience: { type: boolean }
        emailScheduledAt: { type: string, format: date-time, nullable: true }
        blogScheduledAt: { type: string, format: date-time, nullable: true }
        socialScheduledAt: { type: string, format: date-time, nullable: true }
    CampaignImageFailure:
      type: object
      required: [target, prompt, error]
      properties:
        target:
          type: object
          required: [kind]
          properties:
            kind: { type: string, enum: [blog, social, ad] }
            channel: { type: string }
            index: { type: integer }
        prompt: { type: string }
        error: { type: string }
    ApproveCampaignResult:
      type: object
      required: [campaign, imageFailures]
      properties:
        campaign: { $ref: "#/components/schemas/Campaign" }
        imageFailures:
          type: array
          items: { $ref: "#/components/schemas/CampaignImageFailure" }
    RetryCampaignImageBody:
      type: object
      required: [target]
      properties:
        target:
          type: object
          required: [kind]
          properties:
            kind: { type: string, enum: [blog, social, ad] }
            channel: { type: string }
            index: { type: integer }
        prompt: { type: string }
    RetryCampaignImageResult:
      type: object
      required: [target, url]
      properties:
        target:
          type: object
          required: [kind]
          properties:
            kind: { type: string, enum: [blog, social, ad] }
            channel: { type: string }
            index: { type: integer }
        url: { type: string }
        campaign:
          oneOf:
            - { $ref: "#/components/schemas/Campaign" }
            - { type: "null" }

    # ── Keyword watch schemas ────────────────────────────────────────────
    Keyword:
      type: object
      required: [id, term, market, lastSummary, createdAt]
      properties:
        id: { type: integer }
        term: { type: string }
        market: { type: string }
        lastSummary: { type: string }
        lastSummaryAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
    KeywordWithRanks:
      allOf:
        - $ref: "#/components/schemas/Keyword"
        - type: object
          properties:
            currentRank: { type: integer, nullable: true }
            previousRank: { type: integer, nullable: true }
            delta: { type: integer, nullable: true }
            latestSource: { type: string, nullable: true, description: "'serpapi' for live SerpAPI checks, 'shadow' if no key was configured at check time, null if never checked." }
            history:
              type: array
              items:
                type: object
                required: [checkedAt]
                properties:
                  position: { type: integer, nullable: true }
                  checkedAt: { type: string, format: date-time }
                  url: { type: string }
    KeywordRankProvider:
      type: object
      required: [id, label, envKey, signupUrl, freeTierNote, configured]
      properties:
        id:
          type: string
          enum: [serpapi, serper, searchapi, valueserp]
        label: { type: string }
        envKey: { type: string, description: "Environment secret name that holds this provider's API key." }
        signupUrl: { type: string, format: uri }
        freeTierNote: { type: string }
        configured: { type: boolean, description: "True if the env secret is set on the server." }
    KeywordRankStatus:
      type: object
      required: [mode, activeProvider, targetDomain, providers]
      properties:
        mode:
          type: string
          enum: [live, shadow]
          description: "live = active provider's key is set. shadow = no key, ranks are stored as null."
        activeProvider:
          type: string
          enum: [serpapi, serper, searchapi, valueserp]
        targetDomain: { type: string }
        providers:
          type: array
          items: { $ref: "#/components/schemas/KeywordRankProvider" }
    KeywordRankProviderUpdate:
      type: object
      required: [provider]
      properties:
        provider:
          type: string
          enum: [serpapi, serper, searchapi, valueserp]
    KeywordCreateBody:
      type: object
      required: [term]
      properties:
        term: { type: string, minLength: 2, maxLength: 120 }
        market: { type: string, minLength: 2, maxLength: 4 }

    # ── Homepage SEO singleton ───────────────────────────────────────────
    HomepageSeoEffective:
      type: object
      required:
        - h1Visible
        - h1SrOnly
        - h1Subline
        - heroEyebrow
        - heroSubcopy
        - metaKeywords
        - breadcrumbHomeLabel
        - breadcrumbsJsonLdEnabled
      properties:
        h1Visible: { type: string }
        h1SrOnly: { type: string }
        h1Subline: { type: string }
        heroEyebrow: { type: string }
        heroSubcopy: { type: string }
        metaKeywords:
          type: array
          items: { type: string }
        breadcrumbHomeLabel: { type: string }
        breadcrumbsJsonLdEnabled: { type: boolean }
    HomepageSeoRaw:
      type: object
      required: [id, breadcrumbsJsonLdEnabled, metaKeywords, updatedAt]
      properties:
        id: { type: integer }
        h1Visible: { type: string, nullable: true }
        h1SrOnly: { type: string, nullable: true }
        h1Subline: { type: string, nullable: true }
        heroEyebrow: { type: string, nullable: true }
        heroSubcopy: { type: string, nullable: true }
        metaKeywords:
          type: array
          items: { type: string }
        breadcrumbHomeLabel: { type: string, nullable: true }
        breadcrumbsJsonLdEnabled: { type: boolean }
        lastAiSuggestionAt: { type: string, format: date-time, nullable: true }
        aiNotes: { type: string, nullable: true }
        updatedAt: { type: string, format: date-time }
    HomepageSeoEnvelope:
      type: object
      required: [raw, effective]
      properties:
        raw: { $ref: "#/components/schemas/HomepageSeoRaw" }
        effective: { $ref: "#/components/schemas/HomepageSeoEffective" }
    HomepageSeoPatch:
      type: object
      properties:
        h1Visible: { type: string, nullable: true, maxLength: 200 }
        h1SrOnly: { type: string, nullable: true, maxLength: 800 }
        h1Subline: { type: string, nullable: true, maxLength: 240 }
        heroEyebrow: { type: string, nullable: true, maxLength: 80 }
        heroSubcopy: { type: string, nullable: true, maxLength: 400 }
        metaKeywords:
          type: array
          maxItems: 20
          items: { type: string, minLength: 2, maxLength: 80 }
        breadcrumbHomeLabel: { type: string, nullable: true, maxLength: 40 }
        breadcrumbsJsonLdEnabled: { type: boolean }
        aiNotes: { type: string, nullable: true, maxLength: 800 }
    HomepageSeoSuggestion:
      type: object
      required: [suggestion, aiAvailable]
      properties:
        aiAvailable: { type: boolean }
        suggestion:
          type: object
          required:
            - h1Visible
            - h1SrOnly
            - h1Subline
            - heroEyebrow
            - heroSubcopy
            - metaKeywords
            - rationale
          properties:
            h1Visible: { type: string }
            h1SrOnly: { type: string }
            h1Subline: { type: string }
            heroEyebrow: { type: string }
            heroSubcopy: { type: string }
            metaKeywords:
              type: array
              items: { type: string }
            rationale: { type: string }
