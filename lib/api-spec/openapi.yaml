        "401": { description: Unauthorized, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
  /admin/push/broadcast:
    post:
      tags: [admin]
      operationId: adminBroadcastPush
      summary: Broadcast a push notification
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PushBroadcastBody" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PushBroadcastResponse" }
        "401": { description: Unauthorized, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }

  # ── Campaign Orchestrator ─────────────────────────────────────────────
  /admin/campaigns:
    get:
      tags: [admin]
      operationId: adminListCampaigns
      summary: List campaign bundles (newest first)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Campaign" }
        "401": { description: Unauthorized, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
  /admin/campaigns/generate:
    post:
      tags: [admin]
      operationId: adminGenerateCampaign
      summary: AI-generate a campaign bundle (saves a draft by default)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GenerateCampaignBody" }
      responses:
        "200":
          description: Returned proposed bundle (when save=false)
          content:
            application/json:
              schema:
                type: object
                required: [proposed]
                properties:
                  proposed: { $ref: "#/components/schemas/CampaignBundle" }
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Campaign" }
        "400": { description: Validation error, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
        "401": { description: Unauthorized, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
        "502": { description: AI generation failed, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
  /admin/campaigns/{id}:
    get:
      tags: [admin]
      operationId: adminGetCampaign
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Campaign" } } } }
        "401": { description: Unauthorized, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
        "404": { description: Not found, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
    patch:
      tags: [admin]
      operationId: adminUpdateCampaign
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CampaignPatch" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Campaign" } } } }
        "400": { description: Validation error, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
        "401": { description: Unauthorized, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
        "404": { description: Not found, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
    delete:
      tags: [admin]
      operationId: adminDeleteCampaign
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/OkResponse" } } } }
        "401": { description: Unauthorized, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
  /admin/campaigns/{id}/approve:
    post:
      tags: [admin]
      operationId: adminApproveCampaign
      summary: Apply experience preset, create blog/social/email drafts, expose ad export
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApproveCampaignBody" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ApproveCampaignResult" } } } }
        "400": { description: Bad request, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
        "401": { description: Unauthorized, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
        "404": { description: Not found, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
  /admin/campaigns/{id}/retry-image:
    post:
      tags: [admin]
      operationId: adminRetryCampaignImage
      summary: Regenerate a single failed cover image without re-approving
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RetryCampaignImageBody" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/RetryCampaignImageResult" } } } }
        "400": { description: Bad request, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
        "401": { description: Unauthorized, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
        "404": { description: Not found, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
        "502": { description: Image generation failed, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
  /admin/campaigns/{id}/ad-creatives.csv:
    get:
      tags: [admin]
      operationId: adminExportCampaignAdsCsv
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: CSV file
          content:
            text/csv:
              schema: { type: string }
        "401": { description: Unauthorized, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
        "404": { description: Not found, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
  /admin/campaigns/{id}/ad-creatives.json:
    get:
      tags: [admin]
      operationId: adminExportCampaignAdsJson
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [campaign, creatives]
                properties:
                  campaign: { type: string }
                  creatives:
                    type: array
                    items: { $ref: "#/components/schemas/AdCreative" }

  # ── Keyword watch ─────────────────────────────────────────────────────
  /admin/keywords:
    get:
      tags: [admin]
      operationId: adminListKeywords
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/KeywordWithRanks" }
        "401": { description: Unauthorized, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
    post:
      tags: [admin]
      operationId: adminCreateKeyword
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KeywordCreateBody" }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Keyword" } } } }
        "400": { description: Validation error, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
        "401": { description: Unauthorized, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
        "409": { description: Duplicate, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
  /admin/keywords/{id}:
    delete:
      tags: [admin]
      operationId: adminDeleteKeyword
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/OkResponse" } } } }
        "401": { description: Unauthorized, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
  /admin/keywords/status:
    get:
      tags: [admin]
      operationId: adminKeywordRankStatus
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KeywordRankStatus" }
        "401": { description: Unauthorized, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
  /admin/keywords/provider:
    put:
      tags: [admin]
      operationId: adminSetKeywordRankProvider
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KeywordRankProviderUpdate" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [ok, activeProvider]
                properties:
                  ok: { type: boolean }
                  activeProvider:
                    type: string
                    enum: [serpapi, serper, searchapi, valueserp]
        "400": { description: Validation error, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
        "401": { description: Unauthorized, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
  /admin/keywords/refresh:
    post:
      tags: [admin]
      operationId: adminRefreshKeywords
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [checked, tracked]
                properties:
                  checked: { type: integer }
                  tracked: { type: integer }
        "401": { description: Unauthorized, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
  /admin/keywords/summary:
    post:
      tags: [admin]
      operationId: adminSummarizeKeywords
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [updated]
                properties:
                  updated: { type: integer }
        "401": { description: Unauthorized, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status: { type: string }
      required: [status]
    OkResponse:
      type: object
      properties:
        ok: { type: boolean }
      required: [ok]
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error: { type: string }

    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name: { type: string, minLength: 1 }
        size: { type: integer, minimum: 1 }
        contentType: { type: string, minLength: 1 }
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL: { type: string, format: uri }
        objectPath: { type: string }
        metadata: { $ref: '#/components/schemas/UploadUrlRequest' }
    FinalizeUploadInput:
      type: object
      required: [objectPath]
      properties:
        objectPath: { type: string, minLength: 1 }
    FinalizeUploadOutput:
      type: object
      required: [objectPath]
      properties:
        objectPath: { type: string }

    Variant:
      type: object
      required: [size, price, stock]
      properties:
        size: { type: string }
        price: { type: integer }
        stock: { type: integer }
    BrewingGuide:
      type: object
      required: [temperature, steepTime, cupSize, teaAmount, steps]
      properties:
        temperature: { type: string }
        steepTime: { type: string }
        cupSize: { type: string }
        teaAmount: { type: string }
        steps:
          type: array
          items: { type: string }

    Product:
      type: object
      required:
        - id
        - slug
        - name
        - category
        - description
        - shortDescription
        - price
        - rating
        - reviewCount
        - variants
        - tastingNotes
        - ingredients
        - wellnessBenefits
        - brewingGuide
        - origin
        - harvestSeason
        - caffeineLevel
        - flavorProfile
        - wellnessFocus
        - brewingType
        - ritualStyle
        - imageUrl
        - categoryTheme
        - pairsWith
        - moodTags
        - plantationStory
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        category: { type: string }
        description: { type: string }
        shortDescription: { type: string }
        price: { type: integer }
        rating: { type: number }
        reviewCount: { type: integer }
        variants:
          type: array
          items: { $ref: "#/components/schemas/Variant" }
        tastingNotes:
          type: array
          items: { type: string }
        ingredients:
          type: array
          items: { type: string }
        wellnessBenefits:
          type: array
          items: { type: string }
        brewingGuide: { $ref: "#/components/schemas/BrewingGuide" }
        origin: { type: string }
        harvestSeason: { type: string }
        caffeineLevel:
          type: string
          enum: [none, low, medium, high]
        flavorProfile:
          type: array
          items: { type: string }
        wellnessFocus:
          type: array
          items: { type: string }
        brewingType: { type: string }
        ritualStyle: { type: string }
        fomoTag:
          type: string
          nullable: true
        imageUrl: { type: string }
        images:
          type: array
          items: { $ref: "#/components/schemas/ProductImage" }
        categoryTheme: { $ref: "#/components/schemas/CategoryTheme" }
        pairsWith:
          type: array
          items: { type: string }
        moodTags:
          type: array
          items: { type: string }
        plantationStory: { type: string }
        metaTitle: { type: string }
        metaDescription: { type: string }
        jsonLd:
          oneOf:
            - { type: object, additionalProperties: true }
            - { type: "null" }
        relatedProductIds:
          type: array
          items: { type: string }
        relatedArticleSlugs:
          type: array
          items: { type: string }
    ProductImage:
      type: object
      required: [url, kind]
      properties:
        url: { type: string }
        kind:
          type: string
          enum: [hero, studio]
        alt: { type: string }
        isAi: { type: boolean }
    GenerateProductImageRequest:
      type: object
      required: [kind, prompt]
      properties:
        kind:
          type: string
          enum: [hero, studio]
        prompt: { type: string }
        size:
          type: string
          enum: ["1024x1024", "1536x1024", "1024x1536"]
        alt: { type: string }
    CategoryTheme:
      type: object
      required: [primary, accent, bg, gradient, dark]
      properties:
        primary: { type: string }
        accent: { type: string }
        bg: { type: string }
        gradient: { type: string }
        dark: { type: string }
    ProductInput:
      allOf:
        - $ref: "#/components/schemas/Product"

    ArticleSection:
      type: object
      required: [paragraphs]
      properties:
        heading: { type: string }
        paragraphs:
          type: array
          items: { type: string }
    Article:
      type: object
      required: [id, slug, title, excerpt, category, readTime, date, cover, body, published]
      properties:
        id: { type: integer }
        slug: { type: string }
        title: { type: string }
        excerpt: { type: string }
        category: { type: string }
        readTime: { type: string }
        date: { type: string }
        cover: { type: string }
        published: { type: boolean }
        body:
          type: array
          items: { $ref: "#/components/schemas/ArticleSection" }
        metaTitle: { type: string }
        metaDescription: { type: string }
        jsonLd:
          oneOf:
            - { type: object, additionalProperties: true }
            - { type: "null" }
        relatedProductIds:
          type: array
          items: { type: string }
        relatedArticleSlugs:
          type: array
          items: { type: string }
        hashtags:
          type: array
          items: { type: string }
        seoKeywords:
          type: array
          items: { type: string }
    ArticleInput:
      type: object
      required: [slug, title, excerpt, category, readTime, date, cover, body]
      properties:
        slug: { type: string }
        title: { type: string }
        excerpt: { type: string }
        category: { type: string }
        readTime: { type: string }
        date: { type: string }
        cover: { type: string }
        published: { type: boolean }
        body:
          type: array
          items: { $ref: "#/components/schemas/ArticleSection" }
        metaTitle: { type: string }
        metaDescription: { type: string }
        jsonLd:
          oneOf:
            - { type: object, additionalProperties: true }
            - { type: "null" }
        relatedProductIds:
          type: array
          items: { type: string }
        relatedArticleSlugs:
          type: array
          items: { type: string }
        hashtags:
          type: array
          items: { type: string }
        seoKeywords:
          type: array
          items: { type: string }

    AdminReorderRequest:
      type: object
      required: [order]
      properties:
        order:
          type: array
          items: { type: string }
    AdminLoginRequest:
      type: object
      required: [password]
      properties:
        password: { type: string, minLength: 1 }
    AdminSession:
      type: object
      required: [authenticated]
      properties:
        authenticated: { type: boolean }

    ShippingAddress:
      type: object
      required: [line1, city, postalCode, country]
      properties:
        line1: { type: string }
        line2: { type: string }
        city: { type: string }
        region: { type: string }
        postalCode: { type: string }
        country: { type: string }
    OrderItem:
      type: object
      required: [productId, productName, variantSize, quantity, unitPrice]
      properties:
        productId: { type: string }
        productName: { type: string }
        variantSize: { type: string }
        quantity: { type: integer }
        unitPrice: { type: integer }
        subscription: { type: boolean }
    Order:
      type: object
      required: [id, customerName, customerEmail, shippingAddress, currency, subtotal, total, status, items, createdAt]
      properties:
        id: { type: integer }
        customerName: { type: string }
        customerEmail: { type: string }
        shippingAddress: { $ref: "#/components/schemas/ShippingAddress" }
        currency: { type: string }
        subtotal: { type: integer }
        total: { type: integer }
        status:
          type: string
          enum: [pending, processing, shipped, delivered, cancelled]
        notes:
          type: string
          nullable: true
        items:
          type: array
          items: { $ref: "#/components/schemas/OrderItem" }
        createdAt: { type: string, format: date-time }
    OrderStatusUpdate:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [pending, processing, shipped, delivered, cancelled]
        notes:
          type: string
          nullable: true
    CreateOrderRequest:
      type: object
      required: [customerName, customerEmail, shippingAddress, currency, items]
      properties:
        customerName: { type: string, minLength: 1 }
        customerEmail: { type: string, format: email }
        shippingAddress: { $ref: "#/components/schemas/ShippingAddress" }
        currency: { type: string, minLength: 3, maxLength: 3 }
        notes: { type: string }
        items:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/OrderItem" }

    AdminOverview:
      type: object
      required: [productCount, articleCount, draftArticleCount, orderCount, pendingOrderCount, revenueTotal, recentOrders, lowStockProducts]
      properties:
        productCount: { type: integer }
        articleCount: { type: integer }
        draftArticleCount: { type: integer }
        orderCount: { type: integer }
        pendingOrderCount: { type: integer }
        revenueTotal: { type: integer }
        recentOrders:
          type: array
          items: { $ref: "#/components/schemas/Order" }
        lowStockProducts:
          type: array
          items:
            type: object
            required: [id, name, slug, totalStock]
            properties:
              id: { type: string }
              name: { type: string }
              slug: { type: string }
              totalStock: { type: integer }

    ExperienceBanner:
      type: object
      required: [text]
      properties:
        text: { type: string }
        ctaLabel: { type: string }
        ctaHref: { type: string }
    ExperienceHeroTakeover:
      type: object
      required: [title, ctaLabel, ctaHref]
      properties:
        eyebrow: { type: string }
        title: { type: string }
        subtitle: { type: string }
        ctaLabel: { type: string }
        ctaHref: { type: string }
        imageUrl: { type: string }
    ParticleEffect:
      type: string
      enum: [none, rain, snow, leaves, diyas, petals]
    Experience:
      type: object
      required: [id, name, description, themeTokens, particleEffect, isActive, sortOrder]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        themeTokens:
          type: object
          additionalProperties: { type: string }
          description: Map of CSS variable name (without leading --) to value (e.g. HSL "h s% l%")
        banner:
          oneOf:
            - { $ref: "#/components/schemas/ExperienceBanner" }
            - { type: "null" }
        heroTakeover:
          oneOf:
            - { $ref: "#/components/schemas/ExperienceHeroTakeover" }
            - { type: "null" }
        particleEffect: { $ref: "#/components/schemas/ParticleEffect" }
        isActive: { type: boolean }
        sortOrder: { type: integer }
    UpdateExperienceRequest:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        themeTokens:
          type: object
          additionalProperties: { type: string }
        banner:
          oneOf:
            - { $ref: "#/components/schemas/ExperienceBanner" }
            - { type: "null" }
        heroTakeover:
          oneOf:
            - { $ref: "#/components/schemas/ExperienceHeroTakeover" }
            - { type: "null" }
        particleEffect: { $ref: "#/components/schemas/ParticleEffect" }

    Snapshot:
      type: object
      required: [id, kind, objectKey, sizeBytes, rowCounts, status, createdAt]
      properties:
        id: { type: string }
        kind: { type: string, enum: [daily, manual] }
        objectKey: { type: string }
        sizeBytes: { type: integer }
        rowCounts:
          type: object
          additionalProperties: { type: integer }
        status: { type: string, enum: [ready, failed] }
        errorMessage:
          oneOf:
            - { type: string }
            - { type: "null" }
        createdAt: { type: string, format: date-time }
    RestoreSnapshotRequest:
      type: object
      required: [confirm]
      properties:
        confirm:
          type: string
          description: Must equal the snapshot id to confirm the destructive restore.
    RestoreSnapshotResponse:
      type: object
      required: [snapshotId, restored]
      properties:
        snapshotId: { type: string }
        restored:
          type: object
          additionalProperties: { type: integer }
    EntityVersion:
      type: object
      required: [id, entityType, entityId, action, actor, createdAt]
      properties:
        id: { type: integer }
        entityType: { type: string, enum: [product, article, experience] }
        entityId: { type: string }
        action: { type: string, enum: [create, update, delete, revert] }
        before: {}
        after: {}
        actor: { type: string }
        createdAt: { type: string, format: date-time }
    RevertVersionResponse:
      type: object
      required: [entityType, entityId, outcome]
      properties:
        entityType: { type: string, enum: [product, article, experience] }
        entityId: { type: string }
        outcome: { type: string, enum: [restored, deleted] }

    SeoMetaBundle:
      type: object
      required: [metaTitle, metaDescription]
      properties:
        metaTitle: { type: string }
        metaDescription: { type: string }
        jsonLd:
          oneOf:
            - { type: object, additionalProperties: true }
            - { type: "null" }
        hashtags:
          type: array
          items: { type: string }
        seoKeywords:
          type: array
          items: { type: string }
    AdminImageRegenResult:
      type: object
      required: [url]
      properties:
        url: { type: string }
    AdminImageSetCoverRequest:
      type: object
      required: [url]
