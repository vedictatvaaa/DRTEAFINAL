kind = "web"
previewPath = "/"
title = "Dr Tea"
version = "1.0.0"
id = "artifacts/dr-tea"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24331

[services.development]
run = "pnpm --filter @workspace/dr-tea run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/dr-tea", "run", "build" ]
publicDir = "artifacts/dr-tea/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24331"
BASE_PATH = "/"
