# Dr Tea — Coolify deployment
# Coolify's Traefik proxy handles 80/443. Storefront is exposed internally on port 80.
# Set "Domains for storefront" = https://drtea.in in Coolify General settings.
#
# Required env vars (Coolify UI → Environment Variables):
#   POSTGRES_PASSWORD  — e.g. openssl rand -hex 16
#   SESSION_SECRET     — e.g. openssl rand -hex 32
#   ADMIN_PASSWORD     — admin panel password
#   DOMAIN             — e.g. drtea.in  (no https://, no trailing slash)

name: drtea

services:

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: drtea
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: drtea
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drtea -d drtea"]
      interval: 5s
      timeout: 5s
      retries: 20

  api-server:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 8080
      DATABASE_URL: postgresql://drtea:${POSTGRES_PASSWORD}@postgres:5432/drtea
      SESSION_SECRET: ${SESSION_SECRET}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      PUBLIC_STORE_BASE: https://${DOMAIN}
      PUBLIC_API_BASE: https://${DOMAIN}
    expose:
      - "8080"

  storefront:
    build:
      context: .
      dockerfile: Dockerfile
      target: storefront
    restart: unless-stopped
    depends_on:
      - api-server
    expose:
      - "80"

volumes:
  pgdata:
