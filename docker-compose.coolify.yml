# Dr Tea — Coolify deployment
# In Coolify General settings: disable the Coolify proxy (Settings → Proxy → None/Disabled)
# so our own Caddy can own ports 80 and 443 and handle SSL automatically.
#
# Required env vars (Coolify UI → Environment Variables):
#   POSTGRES_PASSWORD  — e.g. openssl rand -hex 16
#   SESSION_SECRET     — e.g. openssl rand -hex 32
#   ADMIN_PASSWORD     — admin panel password
#   DOMAIN             — e.g. drtea.in  (no https://, no trailing slash)
#   ACME_EMAIL         — your email for free SSL cert

name: drtea

services:

  # ── Database ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: drtea
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: drtea
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drtea -d drtea"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ── API server ─────────────────────────────────────────────────────────────
  api-server:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 8080
      DATABASE_URL: postgresql://drtea:${POSTGRES_PASSWORD}@postgres:5432/drtea
      SESSION_SECRET: ${SESSION_SECRET}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      PUBLIC_STORE_BASE: https://${DOMAIN}
      PUBLIC_API_BASE: https://${DOMAIN}
    expose:
      - "8080"

  # ── Storefront — Caddy serves SPA + auto SSL on 80/443 ────────────────────
  storefront:
    build:
      context: .
      dockerfile: Dockerfile
      target: storefront
    restart: unless-stopped
    depends_on:
      - api-server
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/coolify/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
